networks:
  traffic-net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      - traffic-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    networks:
      - traffic-net
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    networks:
      - traffic-net
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic_congestion
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    networks:
      - traffic-net
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    networks:
      - traffic-net
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET;
      /usr/bin/mc anonymous set private local/$$MINIO_BUCKET;
      exit 0;
      "

  spark-master:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - traffic-net
    ports:
      - "8080:8080"
      - "7077:7077"
    env_file:
      - ../.env
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ..:/app

  spark-worker:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - traffic-net
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
    env_file:
      - ../.env
    depends_on:
      - spark-master
    volumes:
      - ..:/app

  grafana:
    image: grafana/grafana:latest
    networks:
      - traffic-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - postgres

  airflow:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    networks:
      - traffic-net
    env_file:
      - ../.env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    volumes:
      - ../dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
    entrypoint: /opt/airflow/entrypoint.sh

volumes:
  postgres-data:
  minio-data:
  airflow-data:
